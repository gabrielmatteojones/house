---
layout: default
title: Calendario
permalink: /calendario/
styles: [calendar]
nohero: true
wide: true
scripts: [calendar-lib]
script: calendar
---
<section class="jcal" id="cal">
  <div class="cal-bar">
    <div class="cal-nav">
      <button class="btn ghost sm" id="c-today" type="button">Oggi</button>
      <button class="icon-btn" id="c-prev" type="button" aria-label="Precedente" title="Precedente (←)">‹</button>
      <button class="icon-btn" id="c-next" type="button" aria-label="Successivo" title="Successivo (→)">›</button>
    </div>
    <h1 class="cal-title" id="c-title" aria-live="polite"></h1>
    <span class="sp"></span>
    <input type="search" id="c-q" placeholder="Cerca eventi" aria-label="Cerca eventi">
    <div class="jseg" id="c-views" role="group" aria-label="Vista">
      <button type="button" data-v="giorno">Giorno</button>
      <button type="button" data-v="settimana">Settimana</button>
      <button type="button" data-v="mese">Mese</button>
      <button type="button" data-v="agenda">Agenda</button>
    </div>
    <button class="btn go sm" data-new type="button">Nuovo evento</button>
  </div>

  <div id="c-view" class="cal-view"></div>

  <div class="cal-foot">
    <label class="check"><input type="checkbox" id="c-fest" checked> Mostra le festività italiane</label>
    <span class="sp"></span>
    <button class="btn ghost sm" id="c-export" type="button">Esporta .ics</button>
    <button class="btn ghost sm" id="c-import" type="button">Importa .ics</button>
    <input type="file" id="c-file" accept=".ics,text/calendar" hidden>
  </div>
  <button class="fab" data-new type="button" aria-label="Nuovo evento" title="Nuovo evento (N)">+</button>
  <p class="cal-hint">Tasti: <b>N</b> nuovo · <b>T</b> oggi · <b>←</b> <b>→</b> precedente/successivo · <b>G</b> <b>S</b> <b>M</b> <b>A</b> cambia vista · <b>/</b> cerca</p>
</section>
